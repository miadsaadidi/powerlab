name: Post-Merge Vercel Watchdog & Cleanup

on:
  pull_request:
    types: [closed]

permissions:
  contents: read
  statuses: read
  checks: read
  pull-requests: write

jobs:
  vercel-post-merge:
    name: Vercel Watchdog & Preview Purge
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Vercel Production Deployment Watchdog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MERGE_COMMIT_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node .github/scripts/vercel-watchdog.cjs

      - name: Vercel Preview Deployments Purge
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          BRANCH_NAME: ${{ github.event.pull_request.head.ref }}
        run: node .github/scripts/vercel-preview-purge.cjs
